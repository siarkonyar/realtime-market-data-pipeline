name: CI

# A pull request into main is tested before it merges. The merge is then
# tested again on main, because main may have moved since the PR's last run.
# Pushes to feature branches start nothing on their own.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# a new push to a PR cancels that PR's older run: only its newest commit
# matters. Main is never cancelled, so every merge commit gets a result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  checks: write #EnricoMi/publish-unit-test-result-action needs this permision
  pull-requests: write #EnricoMi/publish-unit-test-result-action uses this to write the test results as PR comment

env:
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4 #this workflow copies our repo

      - uses: actions/setup-python@v5  #this workflow installs phyton
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip #caches downloaded packages with file hash key
          cache-dependency-path: requirements-dev.txt # when this file changes the cache resets

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check . --output-format=github

  # After ruff the pipeline fans out into one lane per container. Each lane is
  # service-tests.yml: that container's unit job, then its integration job. The
  # four lanes run side by side, and a lane only runs tests/<level>/<service>,
  # so the folder a test lives in decides its lane.
  #
  # These are four plain jobs rather than one matrix on purpose: the Actions
  # graph folds a matrix into a single "Matrix" box, while separate jobs each
  # get their own box, so the four lanes are visible at a glance.
  api:
    needs: lint
    uses: ./.github/workflows/service-tests.yml
    with:
      service: api

  rollup:
    needs: lint
    uses: ./.github/workflows/service-tests.yml
    with:
      service: rollup

  stream:
    needs: lint
    uses: ./.github/workflows/service-tests.yml
    with:
      service: stream

  worker:
    needs: lint
    uses: ./.github/workflows/service-tests.yml
    with:
      service: worker

  # The fan-in point: e2e starts only after all four lanes have finished
  # unit and integration.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [api, rollup, stream, worker]
    timeout-minutes: 20 #cancels the task after 20 minutes

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate a .env for compose
        run: echo "POSTGRES_PASSWORD=e2e" > .env

      - name: Run tests #junit creates the test reports for EnricoMi display them
        run: >-
          pytest -m e2e -v -rA --durations=10
          --junitxml=reports/e2e-junit.xml

      - name: Publish test results # runs every time because of if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          check_name: e2e test results
          files: reports/*.xml
          report_individual_runs: true
          report_suite_logs: any

      # No coverage line here: e2e drives the real container images, so nothing
      # in this job's Python process is measured.
      - name: Test detail
        if: always()
        run: >-
          python scripts/test_summary.py reports/e2e-junit.xml e2e
          >> "$GITHUB_STEP_SUMMARY"

      # tests/e2e/conftest.py saves one log file per service before the stack
      # is torn down. Only kept on failure: a green run needs no logs.
      - name: Upload service logs
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-reports
          path: reports/
          retention-days: 7
          if-no-files-found: ignore

  # Playwright in a real Chromium, side by side with e2e. pytest's stack lives
  # only inside pytest, so this job starts its own with the same two files.
  browser:
    name: browser
    runs-on: ubuntu-latest
    needs: [api, rollup, stream, worker]
    timeout-minutes: 20
    env:
      # docker compose reads this instead of two -f flags on every command.
      COMPOSE_FILE: docker-compose.yaml:tests/e2e/docker-compose.e2e.yaml
    defaults:
      run:
        working-directory: tests/e2e/browser

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # the same Node the frontend image builds with
          cache: npm
          cache-dependency-path: tests/e2e/browser/package-lock.json

      - name: Install dependencies
        run: npm ci

      # --with-deps also installs the Linux libraries Chromium needs.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start the stack
        working-directory: .
        run: |
          echo "POSTGRES_PASSWORD=e2e" > .env
          docker compose up --detach --build

      # The api has no healthcheck, so ask it through nginx until it answers.
      # Uvicorn only serves after the lifespan has created the tables, so a
      # 200 also means /auth/register is ready. The e2e overlay publishes
      # nginx on a random host port; `docker compose port` says which.
      - name: Wait for the frontend and the api
        working-directory: .
        run: |
          address=$(docker compose port frontend 80)
          base_url="http://localhost:${address##*:}"
          for attempt in $(seq 1 60); do
            if curl --silent --fail "$base_url/api/health" > /dev/null; then
              echo "PLAYWRIGHT_BASE_URL=$base_url" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the api did not answer through nginx within 120s"
          exit 1

      - name: Run browser tests
        run: npm test

      # Must run before the job ends: the runner, and the stack with it, is
      # thrown away afterwards.
      - name: Save service logs
        if: failure()
        working-directory: .
        run: |
          mkdir -p reports
          docker compose logs --no-color > reports/browser-compose.log

      # test-results holds a trace of each retried test; open one at
      # https://trace.playwright.dev
      - name: Upload browser reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-reports
          path: |
            tests/e2e/browser/test-results/
            reports/browser-compose.log
          retention-days: 7
          if-no-files-found: ignore

  ci-ok: #this job is for branch protection rule
        # if e2e is skipped it still could merge because it skipped not failed
    name: ci-ok
    runs-on: ubuntu-latest
    needs: [lint, api, rollup, stream, worker, e2e, browser]
    if: always()
    timeout-minutes: 5

    steps:
      - name: Every job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job ended with '$result'"
              exit 1
            fi
          done
