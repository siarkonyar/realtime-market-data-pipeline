# The frontend image copies this over nginx's default site. It is the one door
# the browser uses: the React files, and the api behind /api/ and /ws/.
server {
    listen 80;

    # Where the Dockerfile puts the built dist/ folder.
    root /usr/share/nginx/html;

    # The slash after 8000 matters: nginx replaces the matched "/api/" with
    # "/", so /api/candles reaches the api as /candles.
    location /api/ {
        proxy_pass http://api:8000/;
    }

    # No slash after 8000: the path goes on unchanged, because the api route
    # really is /ws/candles.
    location /ws/ {
        proxy_pass http://api:8000;

        # A WebSocket starts as a normal HTTP request that asks to "upgrade".
        # nginx drops these two headers unless told to pass them on.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else is the React app. A real file (like /assets/index-x.js)
    # is sent as it is; any other path (like /login) gets index.html, and
    # React decides what to show.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
